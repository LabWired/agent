; Universal Arduino C3 — same knobs as core validation/arduino-matrix boards.yaml
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
upload_speed = 460800
; CDC so desk USB-Serial/JTAG sees Serial; twin C3 fast-boot captures Serial via
; the same peripheral path the arduino-matrix uses (not a custom ELF).
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
