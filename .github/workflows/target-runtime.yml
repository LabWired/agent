name: target-runtime

on:
  push:
  pull_request:

jobs:
  portable-contract:
    name: portable target contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run virtual target runtime contract
        run: node --test tests/target-runtime.test.mjs
