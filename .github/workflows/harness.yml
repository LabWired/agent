name: harness
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit + skills + public-install
        run: |
          bash tests/harness.sh
          bash tests/skills-inventory.sh
          bash tests/public-install.sh
          bash tests/prefix-unit.sh
          bash tests/hosted-config.sh
          bash tests/desktop-session.sh
      - name: dispatcher and public package
        run: |
          bash tests/dispatcher.sh
          bash tests/agent-lifecycle.sh
          bash scripts/check-public-package.sh
      - name: demo
        run: ./demo.sh

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies for sim download
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl tar ca-certificates
      - name: portable install smoke
        env:
          LABWIRED_FAST: "1"
          LABWIRED_INSTALL_PIO: "0"
          # Avoid unauthenticated API rate limits on shared Actions IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin when API still fails; must ship labwired-*-$plat.tar.gz assets.
          LABWIRED_CORE_VERSION: v0.21.0
        run: bash tests/install-smoke.sh

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows dispatcher contract
        shell: powershell
        run: .\tests\windows-contract.ps1
      - name: Windows dispatcher contract (PowerShell Core)
        shell: pwsh
        run: .\tests\windows-contract.ps1
      - name: Parse Windows PowerShell sources
        shell: powershell
        run: |
          $errors = @()
          foreach ($file in @(
            ".\bin\labwired.ps1",
            ".\bin\labwired-agent.ps1",
            ".\scripts\install.ps1",
            ".\scripts\public\install.ps1",
            ".\tests\windows-contract.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
            $errors += @($parseErrors)
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

  llm-deepinfra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DeepInfra Kimi chat smoke (skip if no secret)
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          LABWIRED_LLM_MODEL: moonshotai/Kimi-K2.5
        run: |
          if [ -z "${DEEPINFRA_API_KEY}" ]; then
            echo "DEEPINFRA_API_KEY not configured; skipping LLM smoke"
            exit 0
          fi
          bash tests/llm-deepinfra.sh
