; Example board profile only — not the product identity.
; Generic cycle: LABWIRED_HW_WS points here (see scripts/profiles/esp32c3-serial.sh)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; USB-CDC so Serial reaches the host ACM/modem device
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
