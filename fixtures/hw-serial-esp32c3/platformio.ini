; Example HW serial-marker fixture (ESP32-C3 USB-CDC).
; Generic env: LABWIRED_HW_PORT, LABWIRED_HW_MARKER=LABWIRED_OK
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
