; LabWired C3 baseline — ESP32-C3 serial marker fixture
; Build: pio run -d fixtures/c3-baseline
; Flash: pio run -d fixtures/c3-baseline -t upload
; Serial: set LABWIRED_C3_PORT (see README.md)

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; USB-Serial/JTAG boards need CDC on boot or Serial prints never reach /dev/cu.usbmodem*
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-D LABWIRED_C3_BASELINE=1
